<!DOCTYPE html>
<html lang="en">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="color-scheme" content="dark">
<meta name="description" content="Celestial Throne — a fantasy idle RPG: collect heroes of six factions, clear 600 stages, fight in the arena and with your guild.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Celestial Throne</title>
<style>:root{padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));background:#07080b}img{max-width:100%}</style>
<style>@font-face{font-family:'Forum';src:url(fonts/forum.woff) format('woff');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'PT Serif';src:url(fonts/ptserif-400.woff) format('woff');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'PT Serif';src:url(fonts/ptserif-700.woff) format('woff');font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:'PT Serif';src:url(fonts/ptserif-400i.woff) format('woff');font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:'PT Serif';src:url(fonts/ptserif-700i.woff) format('woff');font-weight:700;font-style:italic;font-display:swap}@font-face{font-family:'Rubik';src:url(fonts/rubik.woff) format('woff');font-weight:300 900;font-style:normal;font-display:swap}</style>
</head>
<body>
<style>
/* Тёмная фэнтези-MMO: угольные панели, бронзово-золотая окантовка, зелёные цифры характеристик, золотые эмблемы в нижней панели */
:root{
 color-scheme:dark;
 --ink:#07080b;--bg:#0d0f14;--panel:#14161c;--panel2:#1b1e26;--line:#3a3324;--line2:#5c4c2c;
 --gold:#e9c97f;--gold2:#b88f42;--bronze:#6d5830;--text:#e6e0d2;--mute:#8e897c;--green:#86e06c;--red:#e0574a;--blue:#69b4ff;--jade:#6fe3c8;--good:#86e06c;--bad:#e0574a;
 --display:"Forum","PT Serif",Georgia,serif;--serif:"PT Serif",Georgia,serif;--ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
 --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:#050608;color:var(--text);font:14px/1.4 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea{font:inherit;color:var(--text);background:#0a0b0f;border:1px solid var(--line2);border-radius:3px;padding:9px 11px;width:100%;-webkit-user-select:text;user-select:text}
.ic{display:inline-block;vertical-align:-3px;flex:none}.gi{fill:url(#gg);filter:drop-shadow(0 1px 1px #000)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#1a1c26 0%,var(--bg) 60%);box-shadow:0 0 0 1px #ffffff0a,0 0 80px #000}
html[lang=vi]{--display:system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif;--serif:system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif;--ui:system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.3px;text-wrap:balance}
h2{font-size:25px;color:var(--gold)}h3{font-size:19px;color:var(--gold)}
.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums}.g{color:var(--green)}.gold{color:var(--gold)}

/* заголовок экрана */
#top{position:relative;z-index:6;display:flex;align-items:center;gap:8px;min-height:50px;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:linear-gradient(#16181f,#0e1015);border-bottom:1px solid var(--line)}
#top:empty{display:none}
.ttl{flex:1;min-width:0;font:400 19px var(--display);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .add{width:17px;height:17px;display:grid;place-items:center;color:#e6e0d2;opacity:.85}
.xbtn{width:32px;height:32px;display:grid;place-items:center;color:var(--text);transform:rotate(45deg);border:1px solid #6a6458;background:#0b0c10}
.xbtn .ic{transform:rotate(-45deg)}
.gear{width:34px;height:34px;display:grid;place-items:center;color:var(--gold)}

/* экран */
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:10px 16px;padding-left:var(--gut-l);padding-right:var(--gut-r);overscroll-behavior:contain;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#screen.scr-home{padding:0;overflow:hidden;position:relative}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}.wrap{flex-wrap:wrap}
.card{position:relative;background:linear-gradient(#181a21,#121319);border:1px solid #2a2820;border-radius:4px;padding:12px;box-shadow:inset 0 1px 0 #ffffff08}
.panel{position:relative;border-radius:4px;padding:14px;background:linear-gradient(#1a1c23,#111217);border:1px solid var(--line2);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #2c261a,0 10px 30px -18px #000}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold2);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.hdr{display:flex;align-items:baseline;gap:10px}.hdr small{color:var(--mute)}
.sect{display:flex;align-items:center;gap:8px;font:400 15px var(--serif);color:var(--gold);padding:6px 10px;background:linear-gradient(90deg,#2a2416,#14161c);border-left:2px solid var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:2px;font:500 14px var(--serif);color:#f3e6bf;background:linear-gradient(#7e7040,#58492a 55%,#43381f);border:1px solid #a88a48;box-shadow:inset 0 1px 0 #ffffff30,0 2px 0 #000a;text-shadow:0 1px 1px #000;white-space:nowrap;transition:filter .12s,transform .12s}
.btn:active{transform:translateY(1px)}.btn:hover:not([disabled]){filter:brightness(1.12)}
.btn.sec{color:var(--text);background:linear-gradient(#262832,#191b22);border-color:#4a4434}
.btn.jade{color:#fff;background:linear-gradient(#5fd06a,#2f8f3c 55%,#1f6a2a);border-color:#9ef0a0}
.btn.orange{color:#fff;background:linear-gradient(#ffb84a,#d07a1e 55%,#9a4e10);border-color:#ffd38a}
.btn.red{color:#fff;background:linear-gradient(#d0564a,#8a2a22);border-color:#f08a7a}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}.btn.wide{width:100%}
.btn[disabled]{filter:grayscale(1) brightness(.55);cursor:default}
.cost{display:inline-flex;align-items:center;gap:3px;font:500 12.5px var(--ui);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;padding:3px;background:#0a0b0e;border:1px solid var(--line)}
.tab{flex:1;position:relative;padding:8px 4px;font:400 13.5px var(--serif);color:var(--mute)}
.tab.on{color:var(--gold);background:linear-gradient(#3a3220,#241f15);box-shadow:inset 0 0 0 1px #7a6438}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:2px;font-size:12px;background:#121318;border:1px solid #2c2a22;color:var(--mute)}
.chip.on{color:var(--gold);border-color:var(--gold2);background:#2a2416}
.dot{position:absolute;top:0;right:2px;width:9px;height:9px;border-radius:50%;background:#e8392e;box-shadow:0 0 0 1.5px #000}
.bar{height:7px;background:#07080a;border:1px solid #2c2a22;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8a6a24,#e9c97f)}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}

/* карточки героев */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.hc{position:relative;aspect-ratio:3/4;overflow:hidden;display:block;width:100%;text-align:left;background:#101116;border:1px solid var(--rc,#6a6a6a);box-shadow:inset 0 0 0 1px #000,0 0 0 1px #000}
.hc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #0008,inset 0 -30px 30px -10px #000c;pointer-events:none}
.hc .rb{position:absolute;top:2px;left:3px;z-index:1;font:700 italic 13px/1 var(--serif);color:var(--rc);text-shadow:0 0 6px var(--rc),0 1px 1px #000}
.hc .fb{position:absolute;top:2px;right:2px;z-index:1;width:18px;height:18px;display:grid;place-items:center;color:var(--fc);filter:drop-shadow(0 1px 1px #000)}
.hc .ft{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:2px 4px 3px;font-size:10.5px;line-height:1.15}
.hc .ft b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 11px var(--ui);color:#f0eadb}
.stars{display:inline-flex;gap:1px;vertical-align:middle}.stars i{width:9px;height:9px;background:linear-gradient(#ffe9a0,#d08a20);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.r0{--rc:#9aa7b8}.r1{--rc:#5fd6a8}.r2{--rc:#ffcf4a}.r3{--rc:#ff8a3a}.rM{--rc:#e9c97f}
.r2,.r3,.rM{box-shadow:inset 0 0 0 1px #000,0 0 10px -2px var(--rc)}
.r4{--rc:#ff6ad0;border-color:transparent;background:linear-gradient(#101116,#101116) padding-box,conic-gradient(from var(--a,0deg),#ff6ad0,#7ad0ff,#ffe27a,#9affc8,#ff6ad0) border-box;animation:holo 3s linear infinite;box-shadow:0 0 14px -2px #ff6ad0}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes holo{to{--a:360deg}}
.hc.lock img{filter:grayscale(1) brightness(.25)}.hc.lock .lk{position:absolute;inset:0;z-index:1;display:grid;place-items:center;color:#ffffff40}
.hc.in{outline:2px solid var(--green);outline-offset:-3px}
.hc .tag{position:absolute;top:18px;left:3px;z-index:1;font:700 9px/1 var(--ui);padding:2px 4px;background:var(--green);color:#0b1a08}

/* главная: HUD поверх сцены */
#homeCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2}
.hud-me{top:8px;left:var(--gut-l);display:flex;gap:8px;align-items:flex-start}
.ava{position:relative;width:58px;height:58px;flex:none;border-radius:50%;padding:3px;background:conic-gradient(#8a6a24,#ffe9a0,#8a6a24,#ffe9a0,#8a6a24);box-shadow:0 0 0 1px #000,0 4px 10px #000}
.ava img{width:100%;height:100%;border-radius:50%;display:block;background:#1a1c26}
.ava .vip{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font:700 10px/1 var(--serif);color:#2a1a04;background:linear-gradient(#ffe9a0,#c8952f);padding:2px 6px;border:1px solid #000}
.me-t{display:flex;flex-direction:column;gap:2px;font-size:12px;text-shadow:0 1px 2px #000}
.me-t b{font:500 14px var(--ui)}.me-t .pw{color:#ff8a7a;font-weight:700}.me-t .bf{display:inline-block;padding:1px 6px;background:#1a1d26cc;border:1px solid #4a4434;font-size:11px}
.hud-cur{top:8px;right:var(--gut-r);display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-shadow:0 1px 2px #000}
.hud-cur .row{gap:6px}
.ib{position:relative;display:flex;flex-direction:column;align-items:center;width:62px;gap:1px;font:400 11px/1.15 var(--serif);color:#f2ead6;text-align:center;text-shadow:0 1px 2px #000,0 0 4px #000}
.ib .o{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#3a3a48,#101118);box-shadow:0 0 0 1.5px #b88f42,0 0 0 3px #000,0 4px 10px #000}
.colL{top:84px;left:var(--gut-l);display:flex;flex-direction:column;gap:7px}
.colR{top:84px;right:var(--gut-r);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.evbox{position:relative;width:150px;padding:6px 8px;background:linear-gradient(#2a1f12e6,#140f0ae6);border:1px solid #8a6a2a;font-size:11px;text-align:left}
.evbox b{display:block;font:400 13px var(--serif);color:var(--gold)}
.qtrack{left:0;bottom:116px;width:64%;display:flex;flex-direction:column;gap:3px}
.qt{display:block;width:100%;text-align:left;padding:5px 8px 5px var(--gut-l);background:linear-gradient(90deg,#0c0d12ee,#0c0d1200);font-size:12px;text-shadow:0 1px 2px #000}
.qt b{color:#f3d27a;font-weight:500}.qt span{display:block;color:#cfd2c8}.qt.side b{color:#8ec8ff}.qt.done span{color:var(--green)}
.chat{left:0;bottom:62px;width:64%;max-height:46px;overflow:hidden;padding:3px 8px 3px var(--gut-l);background:linear-gradient(90deg,#0a0b0fdd,#0a0b0f00);font-size:11.5px;line-height:1.45;text-shadow:0 1px 1px #000;pointer-events:none}
.chat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat .c0{color:#e0c060}.chat .c1{color:#8ec8ff}.chat .c2{color:#d08aff}.chat span{color:#d8d4c8}
.hud-br{right:var(--gut-r);bottom:64px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.afkb .o{width:52px;height:52px;background:radial-gradient(circle at 40% 30%,#6a4a1a,#1a120a)}
.fightb{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;background:linear-gradient(#8a2a1a,#4a120a);border:1px solid #ff9a6a;box-shadow:0 0 16px #ff5a2a66,inset 0 1px 0 #ffffff33;font:400 15px var(--serif);color:#fff0d8;text-shadow:0 1px 2px #000}
.fightb small{display:block;font:11px var(--ui);color:#ffd0b0}
.hname{position:absolute;left:0;right:0;text-align:center;z-index:1;pointer-events:none;font:400 15px var(--serif);color:#f3d27a;text-shadow:0 0 8px #000,0 1px 2px #000}
.hname span{display:block;font:12px var(--ui);color:#cfd2c8}

/* нижняя панель */
#nav{position:relative;z-index:6;display:flex;align-items:flex-end;padding-block:4px 0;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));background:linear-gradient(#14151b,#08090c);border-top:1px solid var(--line2);flex-wrap:wrap}
.nb{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font:400 11px var(--serif);color:#b8b2a2;padding:3px 0 4px}
.nb .ic{width:28px;height:28px}
.nb.on{color:var(--gold)}.nb.on::before{content:"";position:absolute;inset:0 3px;background:radial-gradient(60% 60% at 50% 40%,#e9c97f33,#0000);border-bottom:2px solid var(--gold2)}
.nb.mid{z-index:1}.nb.mid .o{width:44px;height:44px;margin:-18px 0 6px;display:grid;place-items:center;transform:rotate(45deg);background:linear-gradient(135deg,#ffe9a0,#b88f42 50%,#5c4520);border:2px solid #000;box-shadow:0 0 0 1px #e9c97f,0 0 18px #e9c97f66}
.nb.mid .o .ic{transform:rotate(-45deg);color:#2a1a04}
.xp{width:100%;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mute);padding:2px 4px 3px}.xp .bar{flex:1;height:5px;border:0;background:#000}.xp .bar i{background:linear-gradient(90deg,#3a9a3a,#86e06c)}

/* модальные окна */
#modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#000c;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.sheet{position:relative;width:100%;max-width:440px;max-height:88%;overflow-y:auto;scrollbar-width:none;animation:pop .22s ease-out}
.sheet::-webkit-scrollbar{display:none}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.x{position:absolute;top:8px;right:8px;width:30px;height:30px;display:grid;place-items:center;z-index:2;border:1px solid #6a6458;background:#0b0c10;transform:rotate(45deg)}.x .ic{transform:rotate(-45deg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.stat{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;border-bottom:1px solid #22201a}.stat b{margin-left:auto;color:var(--green);font-weight:500;font-variant-numeric:tabular-nums}
#toasts{position:absolute;top:58px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.toast{max-width:100%;padding:8px 14px;background:linear-gradient(90deg,#0000,#1a1610f2 15%,#1a1610f2 85%,#0000);border-top:1px solid #8a6a2a;border-bottom:1px solid #8a6a2a;font:13px var(--serif);color:#f3e6bf;animation:tin .25s ease-out,tout .3s ease-in 2.2s forwards}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}@keyframes tout{to{opacity:0}}
.rw{display:flex;flex-wrap:wrap;gap:6px}.rw .pill{padding:3px 8px 3px 4px;background:#0b0c10;border:1px solid #2c2a22}

/* экран героя */
.hs{position:relative;margin-left:calc(-1*var(--gut-l));margin-right:calc(-1*var(--gut-r));margin-top:-10px}
.hs-art{position:relative;height:430px;overflow:hidden;background:radial-gradient(70% 55% at 50% 45%,var(--fd,#3a1a3a) 0%,#0d0f14 72%)}
.hs-art img{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%)}
.hs-name{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:4px 14px;background:linear-gradient(90deg,#0000,#0a0b10e6 20%,#0a0b10e6 80%,#0000);font:400 17px var(--serif);color:#f0eadb;white-space:nowrap}
.rarbig{position:absolute;top:44px;right:calc(var(--gut-r) + 6px);font:700 italic 46px/1 var(--serif);letter-spacing:-2px;background:linear-gradient(#fff6d0,#e9c97f 40%,#a8501a 70%,#5a1a0a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px #000) drop-shadow(0 0 10px #ff8a3a66)}
.rarbig.u{background:linear-gradient(90deg,#ff6ad0,#7ad0ff,#ffe27a,#9affc8);-webkit-background-clip:text;background-clip:text}
.skcol{position:absolute;top:96px;display:flex;flex-direction:column;gap:12px;align-items:center;font:11px var(--serif);text-align:center;color:#e6e0d2;text-shadow:0 1px 2px #000}
.skcol.l{left:var(--gut-l)}.skcol.r{right:var(--gut-r)}
.skc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,var(--sc,#6a3aa0),#140a1e);box-shadow:0 0 0 1.5px #b88f42,0 0 0 3px #000,0 0 12px var(--sc,#6a3aa0)}
.rating{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:400 20px var(--serif);color:#f0eadb;text-shadow:0 1px 3px #000}
.infop{padding:12px var(--gut-r) 12px var(--gut-l);background:linear-gradient(#14161c,#0e0f14);border-top:1px solid var(--line)}
.roster{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px var(--gut-r) 2px var(--gut-l)}.roster::-webkit-scrollbar{display:none}
.roster .hc{flex:none;width:58px}

/* события */
.evc{position:relative;display:block;width:100%;min-height:98px;padding:12px 40% 30px 14px;text-align:left;overflow:hidden;border:1px solid #3a3324;background:#0d0f14}
.evc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.evc .t{position:relative;z-index:1;text-shadow:0 1px 3px #000;overflow-wrap:anywhere}

/* заставка и выбор класса */
#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(80% 55% at 50% 40%,#2a2030 0%,#0d0f14 60%,#050608 100%);transition:opacity .6s}
#splash h1{font-size:48px;line-height:1;text-align:center;background:linear-gradient(#fff6d0,#e9c97f 45%,#8a5a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #e9c97f55)}
#splash .sub{letter-spacing:5px;font:12px var(--serif);color:#b8b2a2;text-transform:uppercase}
#splash .ld{width:220px;height:3px;background:#ffffff12;overflow:hidden}#splash .ld i{display:block;height:100%;background:linear-gradient(90deg,#8a6a24,#ffe9a0);animation:ld 1.6s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
#splash .by{position:absolute;bottom:max(22px,env(safe-area-inset-bottom,0px));font:12px var(--serif);letter-spacing:2px;color:#b8b2a299}
.clsPick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.clsPick button{position:relative;overflow:hidden;border:1px solid #3a3324;aspect-ratio:3/4;text-align:left;background:#0d0f14}
.clsPick button.on{border-color:var(--gold);box-shadow:0 0 18px #e9c97f66}
.clsPick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clsPick span{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(#0000,#050608f0)}.clsPick b{font:400 20px var(--display);color:var(--gold)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
